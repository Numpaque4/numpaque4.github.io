name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile CV PDFs (LaTeX)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            cv-academic-en.tex
            cv-industry-en.tex
            cv-academic-es.tex
            cv-industry-es.tex
          working_directory: resume-latex
          latexmk_use_xelatex: false

      - name: Copy compiled PDFs into public/
        run: |
          mkdir -p public/cv
          cp resume-latex/cv-academic-en.pdf public/cv/cv-academic-en.pdf
          cp resume-latex/cv-industry-en.pdf public/cv/cv-industry-en.pdf
          cp resume-latex/cv-academic-es.pdf public/cv/cv-academic-es.pdf
          cp resume-latex/cv-industry-es.pdf public/cv/cv-industry-es.pdf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
